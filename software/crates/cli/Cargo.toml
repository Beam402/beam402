[package]
name = "beam402"
description = "Race control: run a round against the simulator and print the time slip."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beam402"
path = "src/main.rs"

[dependencies]
beam402-bus = { path = "../bus" }
beam402-event = { path = "../event" }
beam402-http = { path = "../http" }
beam402-mapping = { path = "../mapping" }
beam402-poller = { path = "../poller" }
beam402-protocol = { path = "../protocol" }
beam402-race = { path = "../race" }
beam402-scope = { path = "../scope" }
beam402-scoreboard = { path = "../scoreboard" }
beam402-session = { path = "../session" }
beam402-sim = { path = "../sim" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "1", optional = true }

# TLS exists for exactly one thing: `beam402 push` reaching a receiver across the
# open internet (D36). Nothing in the timing path and nothing that runs on a tree
# ever sees it, and `--no-default-features` gives the dependency-free build for a
# machine that never leaves the track.
[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

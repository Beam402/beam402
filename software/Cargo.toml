[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/mapping",
    "crates/node-core",
    "crates/bus",
    "crates/poller",
    "crates/race",
    "crates/sim",
    "crates/cli",
    "crates/render-map",

name: Bug report
description: Something is wrong — in the docs, firmware, software, or hardware design
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Hardware design
        - Firmware
        - Race control software
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you found, where (file/section/board), and how to reproduce if applicable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead

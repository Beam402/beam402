# An entry sheet. Classes and entries are data, because D23 promises a club
# changes a class rule without seeing a compiler — this file lives in the club's
# own repository beside the mapping file.
#
#   beam402 event events/club-day.toml

[event]
# The id is what ends up in a URL when this day is carried to a server (D33).
id = "club-day"
name = "Club day"
date = "2026-08-15"

[[class]]
name = "Street bracket"
format = "bracket"
# A bracket field is ordered by how close each driver ran to their dial, not by
# who was quickest: a bracket racer's ET is their prediction rather than their
# speed.
seeding = "closest-to-dial"
ladder = "sportsman"

[[class]]
name = "Super Gas"
format = "index"
index_s = 9.90
seeding = "quickest-et"
ladder = "pro"


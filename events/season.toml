# A season skeleton: the classes, and nothing about a particular Saturday.
#
# Classes are a rulebook, so they live here and are versioned with the club's
# other files (D23). Entries change every weekend and come off the registration
# desk's spreadsheet instead:
#
#   beam402 sheet entries.csv --event events/season.toml -o today.toml
#
# Change the id and the date for each event, or generate them from whatever the
# club already uses to schedule its calendar.

[event]
id = "club-day"
name = "Club day"
date = "2026-08-15"
# The league's own key for this event, carried to the API and never interpreted
# (D35) — so their calendar can link to this day by the id they already use.
ref = "2026-round-04"
# The fouls an official here can call — a rulebook's own words, offered to the
# operator as buttons so a season's worth of them still tallies (D37). What the
# system *measures* needs no list: a red light and a breakout are written down
# whatever this says. Calling one of these decides the pair.
fouls = ["centre-line"]

[[class]]
name = "Street bracket"
format = "bracket"
seeding = "closest-to-dial"
ladder = "sportsman"
lane_choice = "previous-round"

[[class]]
name = "Super Gas"
format = "index"
index_s = 9.90
seeding = "quickest-et"
ladder = "pro"
# How many qualify, as a rulebook lists it: the largest size the entry list
# fills. `[8, 16]` is "top 8 from four entries, top 16 from sixteen"; `[16]`
# is a sixteen-car field with byes when fewer turn up; `[2, 4, 8, 16, 32]` is
# the largest bracket that fills. Leave it out and everybody qualifies, which
# is what a club day wants.
field = [8, 16]
# Below this the class does not run, and the draw says so. Commented out because
# this skeleton ships with two demo entries in the class — uncomment it with
# your own number.
# min_entries = 4
# How many passes *score*. A fourth is not forbidden — it is recorded like any
# other pass — it simply does not count towards the field.
attempts = 3

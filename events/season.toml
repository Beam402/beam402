# A season skeleton: the classes, and nothing about a particular Saturday.
#
# Classes are a rulebook, so they live here and are versioned with the club's
# other files (D23). Entries change every weekend and come off the registration
# desk's spreadsheet instead:
#
#   beam402 sheet entries.csv --event events/season.toml -o today.toml
#
# Change the id and the date for each event, or generate them from whatever the
# club already uses to schedule its calendar.

[event]
id = "club-day"
name = "Club day"
date = "2026-08-15"

[[class]]
name = "Street bracket"
format = "bracket"
seeding = "closest-to-dial"
ladder = "sportsman"
lane_choice = "previous-round"

[[class]]
name = "Super Gas"
format = "index"
index_s = 9.90
seeding = "quickest-et"
ladder = "pro"
